<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--side:#12372a;--side2:#1d523c;--pill:#bfe8b8;--pillbg:#c7ecc0;--pilltx:#0f3d2e;--bg:#f1f7ee;--card:#fff;--hero:#d6edcf;--ink:#17301f;--mute:#5c7566;--line:#d5e5d2;--btn:#2f8f4e;--ok:#2f8f4e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c15;--card:#17281f;--hero:#1d4a35;--ink:#e4f1e8;--mute:#9bb5a4;--line:#28402f;--pill:#9fdcae}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;height:100%}
aside{width:250px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#e8f5ea;display:flex;flex-direction:column;padding:16px 14px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px}
.logo{width:38px;height:38px;border-radius:10px;background:#2a6a4d;display:grid;place-items:center;font-size:18px}
.brand b{font-family:"Space Mono",monospace;font-size:14px;letter-spacing:.06em;display:block}
.brand small{font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.08em;opacity:.8}
.team{padding:10px 6px 16px;border-bottom:1px solid #ffffff1f;margin-bottom:14px}
.team b{display:block;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.05em}
.team span{font-size:11px;opacity:.7}
.ws{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;opacity:.55;padding:0 8px 8px}
nav button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;margin-bottom:3px;color:#dcefe2}
nav button:hover{background:#ffffff14}
nav button[aria-current=page]{background:var(--pillbg);color:var(--pilltx);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7bcf8e;outline-offset:2px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 2px;border-top:1px solid #ffffff1f}
.av{width:32px;height:32px;border-radius:50%;background:#3b8a5f;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.me b{font-size:12px;display:block}.me small{opacity:.7;font-size:11px}
.me .out{all:unset;cursor:pointer;margin-left:auto;font-size:11px;text-decoration:underline;opacity:.8}
main{flex:1;min-width:0;overflow:auto}
.top{padding:12px 24px;background:color-mix(in srgb,var(--card) 70%,transparent);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;color:var(--mute);font-size:12px}
.page{padding:24px;max-width:1000px}
.hero{background:var(--hero);border-radius:16px;padding:20px;margin-bottom:18px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;background:var(--btn);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600;font-size:12px}
.btn:hover{filter:brightness(1.1)}
.link{font-size:12px;color:var(--mute);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.tb{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:18px}.tb:hover{background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid .card{margin-bottom:0}
.card h3{margin:0 0 12px;font-size:14px}
.stat{font-size:30px;font-weight:700;margin:4px 0 0}.lab{color:var(--mute);font-size:12px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok)}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--mute)}
.t{flex:1}.tag{font-size:11px;color:var(--mute)}.late{color:#b7791f}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
input[type=text]{flex:1;min-width:160px}
label.lab{display:flex;align-items:center;gap:6px}
h2{margin:0 0 16px;font-size:22px}
.note{background:var(--hero);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.ok{background:#2f8f4e22;color:var(--ok);border-color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal div{min-height:68px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px;font-size:11px}
.cal .h{min-height:0;background:none;border:0;color:var(--mute);text-align:center}
.cal .today{border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn)}
.bar2{display:block;height:17px;line-height:17px;margin-top:3px;padding:0 6px;font-size:10px;color:#17301f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap{display:block;height:17px;margin-top:3px}
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--side),var(--side2))}
.lbox{width:min(380px,100%);background:var(--card);border-radius:16px;padding:28px}
.lbox h1{font-size:20px;margin:0 0 4px}.lbox p{margin:0 0 18px;color:var(--mute);font-size:12px}
.lbox input{width:100%;margin-bottom:10px}.lbox .btn{display:block;text-align:center;width:100%;box-sizing:border-box;padding:11px}
.err{color:#c0392b;font-size:12px;min-height:18px;margin:6px 0}
@media (max-width:760px){
.app{flex-direction:column}
aside{width:100%;flex-direction:row;padding:8px;overflow-x:auto;gap:6px;align-items:center}
.brand,.team,.ws{display:none}
aside nav{display:flex;gap:4px}nav button{white-space:nowrap;width:auto;margin:0}
.me{margin:0 0 0 auto;border:0;padding:0}.me>div:nth-child(2){display:none}
.page{padding:14px}.top{padding:8px 14px}.cal div{min-height:52px}
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <div class="lbox">
    <h1>Thesis Command Center</h1>
    <p>Sign in with the email and password given to you by your team leader.</p>
    <input type="email" id="em" placeholder="Email" autocomplete="username" aria-label="Email">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="signin">Sign in</button>
    <p style="margin:14px 0 0;text-align:center"><button class="link" id="reset">Forgot password?</button></p>
  </div>
</div>
<div class="app" id="app" hidden>
  <aside>
    <div class="brand"><div class="logo">✦</div><div><b>THESIS</b><small>COMMAND CENTER</small></div></div>
    <div class="team"><b>SAMPLE THESIS TITLE</b><span>Pampanga State University</span></div>
    <div class="ws">WORKSPACE</div>
    <nav id="nav" aria-label="Workspace"></nav>
    <div class="me"><div class="av" id="av"></div><div><b id="mn"></b><small id="mr"></small></div><button class="out" id="out">Sign out</button></div>
  </aside>
  <main>
    <div class="top" id="crumb"></div>
    <div class="page" id="view"></div>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,addDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0irEf_H6BnlsSe5aC9U3ES1kkwTaPS_Y",
  authDomain: "portal-af1a4.firebaseapp.com",
  projectId: "portal-af1a4",
  storageBucket: "portal-af1a4.firebasestorage.app",
  messagingSenderId: "126953462950",
  appId: "1:126953462950:web:5335935365e7305b6aa867"
};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);

const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>(n<10?"0":"")+n,iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const fdate=x=>new Date(x+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmt=n=>n.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const NOW=new Date(),TODAY=iso(NOW),COL=["#bfe8b8","#f6d9a0","#b9dfe0","#efc9bd","#d8e6a3"];
const NAV=[["today","Today & my dashboard"],["overview","Overview"],["tasks","Tasks"],["team","Team"],["calendar","Calendar"],["finances","Finances"],["announcements","Announcements"]];
const ROLE={admin:"Admin",finance:"Finance",member:"Member"};
const D={users:[],tasks:[],transactions:[],payments:[],announcements:[]};
let me=null,cur="overview",cm=new Date(NOW.getFullYear(),NOW.getMonth(),1),unsubs=[],pending="";
const isAdmin=()=>me.role==="admin",canFin=()=>me.role==="admin"||me.role==="finance";

/* ---------- auth ---------- */
const showLogin=m=>{$("app").hidden=true;$("login").hidden=false;$("err").textContent=m||""};
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];me=null;
  if(!u){showLogin(pending);pending="";return}
  try{
    const s=await getDoc(doc(db,"users",u.uid));
    if(!s.exists()){pending="Your account isn't set up yet. Ask your team leader.";await signOut(auth);return}
    me={uid:u.uid,...s.data()};
  }catch(e){pending="Could not load your profile.";await signOut(auth);return}
  $("login").hidden=true;$("app").hidden=false;
  $("av").textContent=(me.name||"?")[0];$("mn").textContent=me.name;$("mr").textContent=ROLE[me.role]||me.role;
  Object.keys(D).forEach(k=>unsubs.push(onSnapshot(collection(db,k),s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>console.error(k,e))));
  render();
});
$("signin").onclick=async()=>{
  $("err").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("err").textContent="Wrong email or password."}
};
$("reset").onclick=async()=>{
  const m=$("em").value.trim();if(!m){$("err").textContent="Type your email first.";return}
  try{await sendPasswordResetEmail(auth,m);$("err").textContent="Reset link sent. Check your email."}catch(e){$("err").textContent="Could not send reset email."}
};
$("out").onclick=()=>signOut(auth);

/* ---------- views ---------- */
const sorted=()=>[...D.tasks].sort((a,b)=>a.start.localeCompare(b.start));
const taskRow=x=>{const can=isAdmin()||x.assigneeUid===me.uid,late=!x.done&&x.end<TODAY;
  return `<div class="item${x.done?' done':''}"><input type="checkbox" data-tid="${x.id}" ${x.done?'checked':''} ${can?'':'disabled'} aria-label="Mark done"><span class="t">${esc(x.t)}</span><span class="tag${late?' late':''}">${esc(x.who)} · ${fdate(x.start)} – ${fdate(x.end)}</span>${isAdmin()?`<button class="link" data-del="tasks:${x.id}">Remove</button>`:''}</div>`};
const taskList=l=>l.length?l.map(taskRow).join(""):'<p class="lab">Nothing here yet.</p>';
const people=()=>D.users.map(u=>u.name).sort();

const V={
overview(){const open=D.tasks.filter(x=>!x.done),pct=D.tasks.length?Math.round((D.tasks.length-open.length)/D.tasks.length*100):0;
  return `${isAdmin()?'<section class="hero"><button class="btn" data-go="tasks">+ Assign a task</button></section>':''}<div class="grid"><div class="card"><div class="lab">Progress</div><div class="stat">${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="card"><div class="lab">Open tasks</div><div class="stat">${open.length}</div></div><div class="card"><div class="lab">Team members</div><div class="stat">${D.users.length}</div></div></div><div class="card"><h3>Up next</h3>${taskList(sorted().filter(x=>!x.done).slice(0,3))}</div>`},
today(){const d=sorted().filter(x=>x.start<=TODAY&&TODAY<=x.end),mine=sorted().filter(x=>x.assigneeUid===me.uid);
  return `<h2>Today & my dashboard</h2><div class="grid"><div class="card"><div class="lab">Due today</div><div class="stat">${d.filter(x=>!x.done).length}</div></div><div class="card"><div class="lab">My open tasks</div><div class="stat">${mine.filter(x=>!x.done).length}</div></div></div><div class="card"><h3>Happening today</h3>${taskList(d)}</div><div class="card"><h3>My tasks</h3>${taskList(mine)}</div>`},
tasks(){return `<h2>Tasks</h2>${isAdmin()?`<div class="add"><input type="text" id="nt" placeholder="What needs to be done?" aria-label="Task name"><select id="nw" aria-label="Assign to">${D.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><label class="lab">Start <input type="date" id="ns" value="${TODAY}"></label><label class="lab">Deadline <input type="date" id="ne" value="${TODAY}"></label><button class="btn" id="addt">Assign task</button></div>`:'<div class="note">You can tick off tasks assigned to you. Only the admin can add or remove tasks.</div>'}<div class="card">${taskList(sorted())}</div>`},
team(){return `<h2>Team</h2><div class="grid">${D.users.map(u=>{const n=D.tasks.filter(x=>x.assigneeUid===u.id&&!x.done).length;return `<div class="card"><div class="av" style="background:var(--btn);color:#fff;margin-bottom:10px">${esc((u.name||"?")[0])}</div><b>${esc(u.name)}</b><div class="lab">${ROLE[u.role]||esc(u.role)}</div><div class="lab" style="margin-top:8px">${n} open task${n===1?'':'s'}</div></div>`}).join("")}</div>`},
calendar(){const y=cm.getFullYear(),mo=cm.getMonth(),n=new Date(y,mo+1,0).getDate(),off=cm.getDay(),first=iso(cm),last=y+"-"+p2(mo+1)+"-"+p2(n);
  const L=sorted().filter(x=>x.start<=last&&x.end>=first);
  let h=`<div class="row" style="margin-bottom:14px"><button class="tb" data-m="-1" aria-label="Previous month">‹</button><h2 style="margin:0;min-width:170px;text-align:center">${cm.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</h2><button class="tb" data-m="1" aria-label="Next month">›</button></div><div class="cal">`+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w=>`<div class="h">${w}</div>`).join("");
  for(let i=0;i<off;i++)h+='<div style="opacity:.3"></div>';
  for(let d=1;d<=n;d++){const c=y+"-"+p2(mo+1)+"-"+p2(d),cw=(off+d-1)%7,act=[];let mx=-1;
    L.forEach((x,k)=>{if(x.start<=c&&x.end>=c){act[k]=x;mx=k}});
    let bars="";for(let k=0;k<=mx;k++){const x=act[k];if(!x){bars+='<span class="gap"></span>';continue}
      const cl=c===x.start||cw===0,cr=c===x.end||cw===6,r=v=>v?"6px":"0";
      bars+=`<span class="bar2" title="${esc(x.t)} (${fdate(x.start)} – ${fdate(x.end)})" style="background:${COL[D.tasks.indexOf(x)%5]};margin-left:${cl?0:-6}px;margin-right:${cr?0:-10}px;border-radius:${r(cl)} ${r(cr)} ${r(cr)} ${r(cl)};opacity:${x.done?.55:1}">${cl?esc(x.t):'&nbsp;'}</span>`}
    h+=`<div${c===TODAY?' class="today"':''}><b>${d}</b>${bars}</div>`}
  return h+'</div>'},
finances(){const tot=D.transactions.reduce((s,x)=>s+x.amt,0),col=D.payments.reduce((s,x)=>s+x.amt,0),hand=col-tot,who={};
  people().forEach(n=>who[n]=0);D.payments.forEach(p=>who[p.who]=(who[p.who]||0)+p.amt);
  const chips=Object.keys(who).map(n=>{const ok=who[n]>0;return `<span class="chip ${ok?'ok':''}">${esc(n)} · ${ok?'Paid ₱'+fmt(who[n]):'Not yet paid'}</span>`}).join("");
  const f=canFin(),byDate=l=>[...l].sort((a,b)=>b.date.localeCompare(a.date));
  const rm=(c,id)=>f?`<button class="link" data-del="${c}:${id}">Remove</button>`:'';
  const prow=byDate(D.payments).map(x=>`<div class="item"><span class="tag" style="width:90px">${esc(x.date)}</span><span class="t">${esc(x.who)}</span><b>₱${fmt(x.amt)}</b>${rm('payments',x.id)}</div>`).join("");
  const trow=byDate(D.transactions).map(x=>`<div class="item"><span class="tag" style="width:90px">${esc(x.date)}</span><span class="t">${esc(x.use)}</span><b>₱${fmt(x.amt)}</b>${rm('transactions',x.id)}</div>`).join("");
  return `<h2>Finances</h2>${f?'':'<div class="note">View only. Only the admin and finance officer can edit this page.</div>'}<div class="grid"><div class="card"><div class="lab">Money on hand</div><div class="stat" style="color:${hand<0?'#d64545':'var(--ok)'}">₱${fmt(hand)}</div></div><div class="card"><div class="lab">Total collected</div><div class="stat">₱${fmt(col)}</div></div><div class="card"><div class="lab">Total spent</div><div class="stat">₱${fmt(tot)}</div></div></div>
  <div class="card"><h3>Team payments</h3><div class="chips">${chips}</div>${f?`<div class="add"><input type="text" id="pw2" list="mem" placeholder="Who paid?" aria-label="Member name"><datalist id="mem">${people().map(n=>`<option value="${esc(n)}">`).join("")}</datalist><input type="number" id="pa" min="0" step="0.01" placeholder="Amount (₱)" aria-label="Amount paid"><input type="date" id="pd" value="${TODAY}" aria-label="Date paid"><button class="btn" id="addp">Record payment</button></div>`:''}${prow}</div>
  ${f?`<h3 style="margin:0 0 10px">Add expense</h3><div class="add"><input type="number" id="fa" min="0" step="0.01" placeholder="Amount (₱)" aria-label="Amount"><input type="date" id="fd2" value="${TODAY}" aria-label="Date"><input type="text" id="fu" placeholder="What was it used for?" aria-label="Purpose"><button class="btn" id="addf">Add transaction</button></div>`:''}
  <div class="card"><h3>Financial history</h3>${trow||'<p class="lab">No transactions yet.</p>'}</div>`},
announcements(){const l=[...D.announcements].sort((a,b)=>((b.ts&&b.ts.seconds)||9e9)-((a.ts&&a.ts.seconds)||9e9));
  return `<h2>Announcements</h2>${isAdmin()?'<div class="add"><input type="text" id="an" placeholder="Share an update with the team" aria-label="Announcement"><button class="btn" id="posta">Post update</button></div>':''}${l.map(n=>`<div class="card"><h3>${esc(n.t)}</h3><div class="lab">Posted by ${esc(n.a)}${isAdmin()?` · <button class="link" data-del="announcements:${n.id}">Remove</button>`:''}</div></div>`).join("")||'<p class="lab">No announcements yet.</p>'}`}
};

let dirty=false;
function render(){
  dirty=false;
  $("nav").innerHTML=NAV.map(n=>`<button data-go="${n[0]}"${n[0]===cur?' aria-current="page"':''}>${n[1]}</button>`).join("");
  $("view").innerHTML=V[cur]();
  $("crumb").textContent="Home / "+cur;
}
function refresh(){ // don't wipe a form while someone is typing in it
  if(!me)return;const a=document.activeElement;
  if(a&&$("view").contains(a)&&/INPUT|SELECT/.test(a.tagName)&&a.type!=="checkbox"){dirty=true;return}
  render();
}

/* ---------- actions ---------- */
const run=p=>p.catch(e=>alert(e.code==="permission-denied"?"Your role isn't allowed to do that.":"Something went wrong: "+e.message));
document.addEventListener("click",e=>{
  const t=e.target,g=t.closest("[data-go]");if(g){cur=g.dataset.go;render();return}
  const mn=t.closest("[data-m]");if(mn){cm=new Date(cm.getFullYear(),cm.getMonth()+ +mn.dataset.m,1);render();return}
  const del=t.closest("[data-del]");if(del){const[c,id]=del.dataset.del.split(":");run(deleteDoc(doc(db,c,id)));return}
  const id=t.id,v=x=>$(x)&&$(x).value.trim();
  if(id==="addt"){const s=v("ns"),en=v("ne"),n=v("nt"),u=D.users.find(x=>x.id===$("nw").value);
    if(n&&s&&en&&en>=s&&u){run(addDoc(collection(db,"tasks"),{t:n,who:u.name,assigneeUid:u.id,start:s,end:en,done:false}))}}
  if(id==="addf"){const a=parseFloat($("fa").value),d=v("fd2"),u=v("fu");if(!isNaN(a)&&a>=0&&d&&u)run(addDoc(collection(db,"transactions"),{amt:a,date:d,use:u}))}
  if(id==="addp"){const a=parseFloat($("pa").value),d=v("pd"),w=v("pw2");if(!isNaN(a)&&a>=0&&d&&w)run(addDoc(collection(db,"payments"),{who:w,amt:a,date:d}))}
  if(id==="posta"){const a=v("an");if(a)run(addDoc(collection(db,"announcements"),{t:a,a:me.name,ts:serverTimestamp()}))}
});
document.addEventListener("change",e=>{const i=e.target.dataset&&e.target.dataset.tid;if(i)run(updateDoc(doc(db,"tasks",i),{done:e.target.checked}))});
